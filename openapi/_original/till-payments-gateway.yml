                                    value:
                                        success: false
                                        errorMessage: 'Validation Error: Message'
                                        errorCode: 9999
                                processing error:
                                    value:
                                        success: false
                                        returnType: ERROR
                                        errors:
                                            - errorMessage: Accept Evidence failed
