---
openapi: 3.0.0
info:
    title: 'Till Payments Gateway'
    description: 'Till Payments Gateway'
    termsOfService: ''
    contact:
        email: ''
    license:
        name: MIT
    version: 3.0.0
externalDocs:
    description: 'Till Payments Gateway Documentation'
    url: https://gateway.tillpayments.com/documentation/gateway
servers:
    - url: https://gateway.tillpayments.com/api/v3
tags:
    - name: options
      description: Retrieve a list of options
      externalDocs:
          description: Find out more about the options API
          url: https://gateway.tillpayments.com/documentation/apiv3#options-request
    - name: prepare-transaction
      description: Prepare Transactions
      externalDocs:
          description: Find out more about the transaction API
          url: https://gateway.tillpayments.com/documentation/apiv3
    - name: schedule
      description: Set and manage transaction schedules
      externalDocs:
          description: Find out more about the scheduler API
          url: https://gateway.tillpayments.com/documentation/gateway#scheduler
    - name: status
      description: Retrieve the status of transactions
      externalDocs:
          description: Find out more about the status API
          url: https://gateway.tillpayments.com/documentation/apiv3#status-request
    - name: transaction
      description: Process transactions
      externalDocs:
          description: Find out more about the transaction API
          url: https://gateway.tillpayments.com/documentation/apiv3
paths:
    /transaction/{apiKey}/prepare-debit:
        post:
            tags:
                - prepare-transaction
            summary: Process a prepare Debit
            operationId: processPrepareDebit
            parameters:
                - name: apiKey
                  in: path
                  description: API Key of Connector
                  required: true
                  schema:
                      type: string
            requestBody:
                description: Data which is required to process a Debit
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PrepareDebitRequest'
            responses:
                '200':
                    description: Prepare Debit response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PrepareDebitResponse'
                            examples:
                                success:
                                    value:
                                        success: true
                                        data:
                                            data1: data1
                                            data2: data2
                                error:
                                    value:
                                        success: false
                                        errorMessage: Given identifier 'someIdentifier' is invalid.
    /transaction/{apiKey}/debit:
        post:
            tags:
                - transaction
            summary: Process a debit
            operationId: processDebit
            parameters:
                - name: apiKey
                  in: path
                  description: API Key of Connector
                  required: true
                  schema:
                      type: string
            requestBody:
                description: Data which is required to process a debit
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Debit'
                        example:
                            merchantTransactionId: 2019-09-02-0001
                            additionalId1: x0001
                            additionalId2: y0001
                            extraData:
                                someKey: someValue
                                otherKey: otherValue
                            merchantMetaData: merchantRelevantData
                            surchargeAmount: '0.99'
                            amount: '9.99'
                            currency: EUR
                            successUrl: http://example.com/success
                            cancelUrl: http://example.com/cancel
                            errorUrl: http://example.com/error
                            callbackUrl: http://example.com/callback
                            transactionToken: ix::tRaNsAcT1OnToK3N
                            description: Example Product
                            customer:
                                identification: c0001
                                firstName: John
                                lastName: Doe
                            threeDSecureData:
                                3dsecure: MANDATORY
                            referenceSchemeTransactionIdentifier: IXHKDJRR462950
                            language: en
                required: true
            responses:
                '200':
                    description: Transaction response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TransactionResponse'
                            examples:
                                finished:
                                    value:
                                        success: true
                                        uuid: abcde12345abcde12345
                                        purchaseId: 20190927-abcde12345abcde12345
                                        returnType: FINISHED
                                        paymentMethod: Creditcard
                                redirect:
                                    value:
                                        success: true
                                        uuid: abcde12345abcde12345
                                        purchaseId: 20190927-abcde12345abcde12345
                                        returnType: REDIRECT
                                        redirectUrl: http://redirectComesUrlHere.com
                                        redirectQRCode: data:image/png;base64,ABCDEFGHIJKLMNOPQRSTUVWXYZ
                                        paymentMethod: Creditcard
                                processing error:
                                    value:
                                        success: false
                                        uuid: abcde12345abcde12345
                                        purchaseId: 20200924-abcde12345abcde12345
                                        returnType: ERROR
                                        paymentMethod: Dummy
                                        errors:
                                            - errorMessage: Dummy error
                                              errorCode: 1003
                                              adapterMessage: Dummy adapter error
                                general error, e.g. duplicate:
                                    value:
                                        success: false
                                        errorMessage: The transaction ID '20190823062178' already exists!
                                        errorCode: 3004
                                general error, e.g. validation:
                                    value:
                                        success: false
                                        errorMessage: "root: 'amount' is required"
                                        errorCode: 1002
    /transaction/{apiKey}/prepare-preauthorize:
        post:
            tags:
