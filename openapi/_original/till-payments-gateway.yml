                    $ref: '#/components/schemas/Amount'
                currency:
                    $ref: '#/components/schemas/Currency'
                successUrl:
                    type: string
                    maxLength: 65535
                cancelUrl:
                    type: string
                    maxLength: 65535
                errorUrl:
                    type: string
                    maxLength: 65535
                callbackUrl:
                    type: string
                    maxLength: 65535
                transactionToken:
                    type: string
                description:
                    type: string
                    maxLength: 255
                items:
                    $ref: '#/components/schemas/Items'
                splits:
                    $ref: '#/components/schemas/Splits'
                withRegister:
                    type: boolean
                transactionIndicator:
                    type: string
                    enum:
                        - SINGLE
                        - INITIAL
                        - RECURRING
                        - FIRST-CARDONFILE
                        - CARDONFILE
                        - CARDONFILE-MERCHANT-INITIATED
                        - MOTO
                customer:
                    $ref: '#/components/schemas/Customer'
                schedule:
                    $ref: '#/components/schemas/Schedule'
                customerProfileData:
                    $ref: '#/components/schemas/CustomerProfileData'
                threeDSecureData:
                    $ref: '#/components/schemas/ThreeDSecureData'
