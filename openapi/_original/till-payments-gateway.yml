    /schedule/{apiKey}/start:
        post:
            tags:
                - schedule
            summary: Start a schedule. Requires the registrationId of an existing transaction of type Register / Debit-with-register / Preauthorize-with-register
            operationId: startSchedule
            parameters:
                - name: apiKey
                  in: path
                  description: API Key of Connector
                  required: true
                  schema:
                      type: string
            requestBody:
                description: Start a schedule on the given registration transaction
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StartSchedule'
                        example:
                            registrationUuid: abcde01234abcde01234
                            amount: '9.99'
                            currency: EUR
                            periodLength: 6
                            periodUnit: MONTH
                            startDateTime: '2019-09-30T01:00:00+00:00'
                required: true
            responses:
                '200':
                    description: Schedule response
