components:
    parameters:
        ApiKey:
            name: apiKey
            in: path
            description: API key of connector.
            required: true
            schema:
                type: string
                maxLength: 50
        Uuid:
            name: uuid
            in: path
            description: Uuid of Dispute
            required: true
            schema:
                type: string
    schemas:
        PrepareDebitRequest:
            type: object
            required:
                - amount
                - currency
            properties:
                merchantTransactionId:
                    type: string
                    minLength: 1
                    maxLength: 50
                additionalId1:
                    type: string
                    minLength: 1
                    maxLength: 50
                additionalId2:
                    type: string
                    minLength: 1
                    maxLength: 50
                extraData:
                    $ref: '#/components/schemas/ExtraData'
                merchantMetaData:
                    type: string
                    maxLength: 255
                referenceUuid:
                    type: string
                    minLength: 1
                    maxLength: 50
                amount:
                    $ref: '#/components/schemas/Amount'
                currency:
                    $ref: '#/components/schemas/Currency'
                successUrl:
                    type: string
                    maxLength: 65535
                cancelUrl:
                    type: string
                    maxLength: 65535
                errorUrl:
                    type: string
                    maxLength: 65535
                callbackUrl:
                    type: string
                    maxLength: 65535
                transactionToken:
                    type: string
                description:
                    type: string
                    maxLength: 255
                items:
                    $ref: '#/components/schemas/Items'
                withRegister:
                    type: boolean
                transactionIndicator:
                    type: string
                    enum:
                        - SINGLE
                        - INITIAL
                        - RECURRING
                        - FIRST-CARDONFILE
                        - CARDONFILE
                        - CARDONFILE-MERCHANT-INITIATED
                customer:
                    $ref: '#/components/schemas/Customer'
                schedule:
                    $ref: '#/components/schemas/Schedule'
                customerProfileData:
                    $ref: '#/components/schemas/CustomerProfileData'
                threeDSecureData:
                    $ref: '#/components/schemas/ThreeDSecureData'
                language:
                    type: string
                    minLength: 2
                    maxLength: 2
            additionalProperties: false
        PrepareDebitResponse:
            type: object
            properties:
                success:
                    type: boolean
                error:
                    type: string
            additionalProperties: true
        Debit:
            type: object
            required:
                - merchantTransactionId
                - amount
                - currency
            properties:
                merchantTransactionId:
                    type: string
                    minLength: 1
                    maxLength: 50
                additionalId1:
                    type: string
                    minLength: 1
                    maxLength: 50
                additionalId2:
                    type: string
                    minLength: 1
                    maxLength: 50
                extraData:
                    $ref: '#/components/schemas/ExtraData'
                pspPassthroughData:
                    $ref: '#/components/schemas/PspPassthroughData'
                merchantMetaData:
                    type: string
                    maxLength: 255
