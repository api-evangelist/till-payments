components:
  schemas:
    Debit:
      type: object
      required:
        - merchantTransactionId
        - amount
        - currency
      properties:
        merchantTransactionId:
          type: string
          minLength: 1
          maxLength: 50
        additionalId1:
          type: string
          minLength: 1
          maxLength: 50
        additionalId2:
          type: string
          minLength: 1
          maxLength: 50
        extraData:
          $ref: '#/components/schemas/ExtraData'
        pspPassthroughData:
          $ref: '#/components/schemas/PspPassthroughData'
        merchantMetaData:
          type: string
          maxLength: 255
        cardDetailsUpdate:
          $ref: '#/components/schemas/CardDetailsUpdateData'
        referenceUuid:
          type: string
          minLength: 1
          maxLength: 50
        amount:
          $ref: '#/components/schemas/Amount'
        surchargeAmount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        paymentToken:
          oneOf:
            - $ref: '#/components/schemas/ExternallyProvisionedApplePayToken'
            - $ref: '#/components/schemas/ExternallyProvisionedGooglePayToken'
            - $ref: '#/components/schemas/ExternallyProvisionedNetworkToken'
          discriminator:
            propertyName: type
            mapping:
              EXTERNAL-APPLEPAY: '#/components/schemas/ExternallyProvisionedApplePayToken'
              EXTERNAL-GOOGLEPAY: '#/components/schemas/ExternallyProvisionedGooglePayToken'
              EXTERNAL-NETWORK: '#/components/schemas/ExternallyProvisionedNetworkToken'
        successUrl:
          type: string
          maxLength: 65535
        cancelUrl:
          type: string
          maxLength: 65535
        errorUrl:
          type: string
          maxLength: 65535
        callbackUrl:
          type: string
          maxLength: 65535
        transactionToken:
          type: string
        description:
          type: string
          maxLength: 255
        items:
          $ref: '#/components/schemas/Items'
        splits:
          $ref: '#/components/schemas/Splits'
        withRegister:
          type: boolean
        transactionIndicator:
          type: string
          enum:
            - SINGLE
            - INITIAL
            - RECURRING
            - FIRST-CARDONFILE
            - CARDONFILE
            - CARDONFILE-MERCHANT-INITIATED
            - MOTO
        customer:
          $ref: '#/components/schemas/Customer'
        schedule:
          $ref: '#/components/schemas/Schedule'
        customerProfileData:
          $ref: '#/components/schemas/CustomerProfileData'
        threeDSecureData:
          $ref: '#/components/schemas/ThreeDSecureData'
        language:
          type: string
          minLength: 2
          maxLength: 2
        requestDcc:
          type: boolean
        dccData:
          $ref: '#/components/schemas/DccData'
        l2l3Data:
          $ref: '#/components/schemas/L2L3Data'
        cardData:
          $ref: '#/components/schemas/CardData'
        publicData:
          $ref: '#/components/schemas/PublicData'
        referenceSchemeTransactionIdentifier:
          type: string
          maxLength: 50
        includeTracing:
          type: boolean
      additionalProperties: false
    Preauthorize:
      type: object
      required:
        - merchantTransactionId
        - amount
        - currency
      properties:
        merchantTransactionId:
          type: string
          minLength: 1
          maxLength: 50
        additionalId1:
          type: string
          minLength: 1
          maxLength: 50
        additionalId2:
          type: string
          minLength: 1
          maxLength: 50
        captureInMinutes:
          type: integer
          minimum: 1
        extraData:
          $ref: '#/components/schemas/ExtraData'
        pspPassthroughData:
          $ref: '#/components/schemas/PspPassthroughData'
        merchantMetaData:
          type: string
          maxLength: 255
        cardDetailsUpdate:
          $ref: '#/components/schemas/CardDetailsUpdateData'
        referenceUuid:
          type: string
          minLength: 1
          maxLength: 50
        amount:
          $ref: '#/components/schemas/Amount'
        surchargeAmount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        paymentToken:
          oneOf:
            - $ref: '#/components/schemas/ExternallyProvisionedApplePayToken'
            - $ref: '#/components/schemas/ExternallyProvisionedGooglePayToken'
            - $ref: '#/components/schemas/ExternallyProvisionedNetworkToken'
          discriminator:
            propertyName: type
            mapping:
              EXTERNAL-APPLEPAY: '#/components/schemas/ExternallyProvisionedApplePayToken'
              EXTERNAL-GOOGLEPAY: '#/components/schemas/ExternallyProvisionedGooglePayToken'
              EXTERNAL-NETWORK: '#/components/schemas/ExternallyProvisionedNetworkToken'
        successUrl:
          type: string
          maxLength: 65535
        cancelUrl:
          type: string
          maxLength: 65535
        errorUrl:
          type: string
          maxLength: 65535
        callbackUrl:
          type: string
          maxLength: 65535
        transactionToken:
          type: string
        description:
          type: string
          maxLength: 255
        items:
          $ref: '#/components/schemas/Items'
        splits:
          $ref: '#/components/schemas/Splits'
        withRegister:
          type: boolean
        transactionIndicator:
          type: string
          enum:
            - SINGLE
            - INITIAL
            - RECURRING
            - FIRST-CARDONFILE
            - CARDONFILE
            - CARDONFILE-MERCHANT-INITIATED
            - MOTO
        customer:
          $ref: '#/components/schemas/Customer'
        schedule:
          $ref: '#/components/schemas/Schedule'
        customerProfileData:
          $ref: '#/components/schemas/CustomerProfileData'
        threeDSecureData:
          $ref: '#/components/schemas/ThreeDSecureData'
        language:
          type: string
          minLength: 2
          maxLength: 2
        requestDcc:
          type: boolean
        dccData:
          $ref: '#/components/schemas/DccData'
        l2l3Data:
          $ref: '#/components/schemas/L2L3Data'
        cardData:
          $ref: '#/components/schemas/CardData'
        publicData:
          $ref: '#/components/schemas/PublicData'
        referenceSchemeTransactionIdentifier:
          type: string
          maxLength: 50
        includeTracing:
          type: boolean
        requestPartialAuthorization:
          type: boolean
          description: >
            Request a partial authorization when the full amount cannot be authorized.
            The actual authorized amount may be less than the requested amount.
            Available on: CheckoutCom, StripeExtended, WorldLine
