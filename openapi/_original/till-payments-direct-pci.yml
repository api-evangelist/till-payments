      allOf:
        - $ref: '#/components/schemas/BaseExternallyProvisionedToken'
      type: object
      required:
        - cryptogram
        - tokenExpirationDay
      properties:
        tokenExpirationDay:
          type: string
          pattern: '^(0[1-9]|[12][0-9]|3[01])$'
          example: "01"
        deviceManufacturerIdentifier:
          type: string
    ExternallyProvisionedGooglePayToken:
      allOf:
        - $ref: '#/components/schemas/BaseExternallyProvisionedToken'
      type: object
    ExternallyProvisionedNetworkToken:
      allOf:
        - $ref: '#/components/schemas/BaseExternallyProvisionedToken'
      type: object
      properties:
        cardHolder:
          type: string
        panUniqueReference:
          type: string
        tokenUniqueReference:
          type: string
        panLastFourDigits:
          type: string
          maxLength: 4
        tokenRequestorId:
          type: string
    BaseExternallyProvisionedToken:
        type: object
        required:
          - type
          - token
          - tokenExpirationMonth
          - tokenExpirationYear
        properties:
          type:
            type: string
            enum:
              - 'EXTERNAL-NETWORK'
              - 'EXTERNAL-GOOGLEPAY'
              - 'EXTERNAL-APPLEPAY'
          token:
            type: string
          cryptogram:
            type: string
          paymentAccountReference:
            type: string
            maxLength: 29
            pattern: '^[A-Za-z0-9]+$'
          tokenExpirationMonth:
            type: string
            pattern: '^(0[1-9]|1[0-2])$'
            example: "07"
          tokenExpirationYear:
            type: string
            pattern: '^[0-9]{4}$'
            example: "2025"
          eciIndicator:
            type: string
            pattern: '^[0-9]{2}$'
            example: "05"
