      type: object
      properties:
        success:
          type: boolean
        uuid:
          type: string
        purchaseId:
          type: string
        returnType:
          type: string
          enum:
          - FINISHED
          - REDIRECT
          - HTML
          - PENDING
          - ERROR
          - PENDING_DCC
        redirectType:
          type: string
          enum:
          - iframe
          - fullpage
          - 3ds
        redirectUrl:
          type: string
          maxLength: 255
        redirectQRCode:
          type: string
          description: DataUrl
        htmlContent:
          type: string
        paymentDescriptor:
          type: string
        paymentMethod:
          type: string
        returnData:
          $ref: '#/components/schemas/ReturnData'
        scheduleData:
          $ref: '#/components/schemas/ScheduleData'
        customerProfileData:
