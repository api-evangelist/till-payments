              adapterMessage:
                type: string
              adapterCode:
                type: string
            additionalProperties: false
        adapterMessage:
          type: string
        adapterCode:
          type: string
        extraData:
          $ref: '#/components/schemas/ExtraData'
        dccData:
          type: object
          properties:
