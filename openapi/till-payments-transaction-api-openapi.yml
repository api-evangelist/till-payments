        _TYPE:
          type: string
          enum:
          - cardData
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        country:
          $ref: '#/components/schemas/Country'
        cardHolder:
          type: string
        expiryMonth:
          type: string
          pattern: ^((0[1-9])|(1[0-2]))$
        expiryYear:
          type: string
          pattern: ^[0-9]{4}$
        binDigits:
          type: string
          pattern: ^[0-9]{6-8}$
        firstSixDigits:
          type: string
          pattern: ^[0-9]{6}$
        lastFourDigits:
          type: string
          pattern: ^[0-9]{4}$
        fingerprint:
          type: string
        binBrand:
          type: string
        binBank:
          type: string
        binType:
          type: string
        binLevel:
          type: string
        binCountry:
          type: string
        binSegment:
          type: string
          enum:
          - Consumer
          - Business
          - Commercial
          - Government
          - Unknown
        binRawData:
          type: object
          properties:
            type:
              type: string
            data:
              type: object
              additionalProperties: true
        threeDSecure:
          type: string
        eci:
          type: string
        merchantAdviceCode:
          type: string
        parsedMerchantAdviceCode:
          type: string
        schemeTransactionIdentifier:
          type: string
        schemeLifecycleIdentifier:
          type: string
        referenceSchemeLifecycleIdentifier:
          type: string
        cardUpdateStatus:
          type: string
          enum:
          - updated
          - contact
          - new-expiry
          - closed
