apis:
- aid: till-payments:till-payments-gateway
  name: Till Payments Gateway API
  description: >-
    The Till Payments Gateway V3 API for processing card-present and
    card-not-present transactions — debit, preauthorize, capture, void, refund,
    payout, registration/tokenization, recurring schedules, transaction status,
    3-D Secure/DCC flows, and dispute handling — with asynchronous callbacks via
    a merchant-supplied callbackUrl.
  humanURL: https://gateway.tillpayments.com/documentation/apiv3
  baseURL: https://gateway.tillpayments.com/api/v3
  tags:
  - Payments
  - Gateway
  - Transactions
  properties:
  - type: OpenAPI
    url: openapi/till-payments-gateway.yml
  - type: Documentation
    url: https://gateway.tillpayments.com/documentation/gateway
  - type: APIReference
    url: https://gateway.tillpayments.com/documentation/apiv3
- aid: till-payments:till-payments-direct-pci
  name: Till Payments Direct PCI-enabled API
  description: >-
    The Till Payments Direct PCI-enabled Payment Platform V3 API for merchants
    that are PCI DSS certified to collect and transmit raw cardholder data.
    Requests are sent over HTTPS (TLS 1.2+) with JSON bodies to the secure host
    for direct transaction processing.
  humanURL: https://gateway.tillpayments.com/documentation/json-direct-pci-enabled-api
  baseURL: https://secure.tillpayments.com/api/v3
  tags:
  - Payments
  - PCI
  - Transactions
  properties:
  - type: OpenAPI
    url: openapi/till-payments-direct-pci.yml
  - type: Documentation
    url: https://gateway.tillpayments.com/documentation/json-direct-pci-enabled-api
  - type: APIReference
    url: https://gateway.tillpayments.com/documentation/json-direct-pci-enabled-api
- aid: till-payments:till-payments-pay-by-link
  name: Till Payments Pay By Link API
  description: >-
    The Till Payments Pay By Link API for generating shareable hosted payment
    links, documented on the Till developer documentation site. No downloadable
    OpenAPI specification was published for this product at the time of review.
  humanURL: https://docs.tillpayments.com/openapi/pay-by-link/paybylink/overview/
  tags:
  - Payments
  - Pay By Link
  properties:
  - type: Documentation
    url: https://docs.tillpayments.com/openapi/pay-by-link/paybylink/overview/
- aid: till-payments:till-payments-terminal-connect
  name: Till Payments Terminal Connect API
  description: >-
    Terminal Connect is Till Payments' in-person integration surface for
    connecting point-of-sale software to Till payment terminals, documented via
    getting-started and integration guides on the Till developer documentation
    site. No downloadable OpenAPI specification was published for this product at
    the time of review.
  humanURL: https://docs.tillpayments.com/guides/terminal-connect/getting-started/
  tags:
  - Payments
  - In-Person Payments
