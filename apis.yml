aid: till-payments
url: https://raw.githubusercontent.com/api-evangelist/till-payments/refs/heads/main/apis.yml
name: Till Payments
kind: company
description: >-
  Till Payments is a Sydney, Australia founded merchant acquirer and payment
  technology company (established 2012), focused on integrated payments for
  independent software vendors, platforms, and omnichannel merchants across
  online, in-person, and unattended channels. Its product family spans a
  card-present and card-not-present processing Gateway, a PCI-enabled Direct API
  for merchants handling raw card data, Pay By Link, and Terminal Connect for
  in-person device integrations. Till was acquired by Nuvei in 2024 and now
  operates as part of Nuvei's global platform while retaining its Australian home
  market and developer surface. Its API posture is genuinely API-first: a public
  developer hub, hosted V3 reference documentation, and two downloadable OpenAPI
  3.0 specifications (the Gateway API and the Direct PCI-enabled Payment
  Platform), both authenticated with HTTP Basic credentials over TLS 1.2+.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
